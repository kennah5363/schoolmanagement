<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid main-wrapper">
        <div class="row login-container">

            <!-- LEFT -->
            <div class="col-lg-7 p-0">
                <div class="left-section">
                    <div class="overlay"></div>

                    <div class="welcome-text">
                        <h1>Skills To Empowerment</h1>
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="col-lg-5 right-section">

                <div class="login-box">

                    <!-- Logo -->
                    <div class="text-center">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo" alt="Logo">
                    </div>

                    <h1 class="title">Hi, welcome back</h1>
                    <p class="subtitle">Please fill in your details to log in</p>

                    <!-- FORM CARD -->
                    <div class="card-box">
                      <form id="loginForm">
                        

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" placeholder="Student No/ Employee No">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Password</label>

                            <div class="password-wrapper">
                                <input type="password" name="password" id="password" class="form-control"
                                    placeholder="Enter your Password">

                                <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="text-decoration-none fw-semibold">
                                Forgot Password?
                            </a>
                        </div>

                        <button type="submit" class="btn-login">
                            Sign In
                        </button>
                                              </form>


                    </div>

                    <!-- <div class="bottom-links">
                        Don’t have an account ?
                        <a href="#">Sign Up</a>
                    </div> -->

                    <div class="copyright">
                        Copyright © 2026 – Fresh Softwares
                    </div>

                </div>

            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
        <script src="/src/scripts/passVisible.js"></script>
    <!-- <script src="index.js"></script> -->
    <script src="/src/scripts/loginUser.js"></script>
</body>

</html>
