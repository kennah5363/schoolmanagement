<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Table</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/styles/style.css">
</head>
<style>
    .table-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    @media(max-width:768px) {
        .topbar {
            width: 950px;
        }

        .table-heading {
            flex-direction: column;
            align-items: flex-start;
        }
    }
</style>

<body>

    <!-- =========================
     SIDEBAR
========================= -->

    <div class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
            <div class="toggle-btn" id="unToggleBtn">
                <i class="bi bi-arrow-left"></i>
            </div>
        </div>


        <ul class="sidebar-menu">


            <li>
                <a href="/schoolmanagement/pages/admin.html"">
                    <div class="menu-left">
                        <i class="bi bi-grid"></i>
                        Dashboard
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="students.html">
                    <div class="menu-left">
                        <i class="bi bi-people"></i>
                        Students
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="#" class="active">
                    <div class="menu-left">
                        <i class="bi bi-person-workspace"></i>
                        Teachers
                    </div>
                </a>
            </li>

            <li>
                <a href="courses.html">
                    <div class="menu-left">
                        <i class="bi bi-book"></i>
                        Courses
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="finance.html">
                    <div class="menu-left">
                        <i class="bi bi-cash-stack"></i>
                        Finance
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="departments.html">
                    <div class="menu-left">
                        <i class="bi bi-building"></i>
                        Departments
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="timetable.html">
                    <div class="menu-left">
                        <i class="bi bi-calendar-event"></i>
                        Timetable
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="exams.html">
                    <div class="menu-left">
                        <i class="bi bi-file-earmark-text"></i>
                        Exams
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <li>
                <a href="settings.html ">
                    <div class="menu-left">
                        <i class="bi bi-gear"></i>
                        Settings
                    </div>
                </a>
            </li>

        </ul>

    </div>

    <!-- =========================
     MAIN CONTENT
========================= -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div class="topbar-left">

                <div class="toggle-btn" id="toggleBtn">
                    <i class="bi bi-list"></i>
                </div>

                <h2 class="school-title">
                    College Management System
                </h2>

            </div>

            <div class="topbar-right">

                <div class="notification">
                    <i class="bi bi-bell"></i>
                    <span>3</span>
                </div>

                <div class="profile">
                    <button type="button" class="btn btn-outline-danger" id="logoutBtn">
                        Logout
                    </button>
                </div>
                <!-- <div class="profile">
        <i class="bi bi-person-circle fs-4"></i>
        <span>Hi, Student</span>
      </div> -->

            </div>

        </div>
        <div class="container mt-5">
            <div class="table-heading">
                <h1 class="mb-4">Teachers Table</h1>
                <button class="btn btn-custom" id="addTeacher" type="button" data-bs-toggle="modal"
                    data-bs-target="#addTeacherModal">
                    Add Teacher
                </button>
                <button class="btn btn-custom" onclick="printDiv('teachersTable')">
                    <i class="bi bi-printer-fill" aria-hidden="true"></i>
                </button>
            </div>

            <table class="table table-striped" id="teachersTable">
                <thead>
                    <tr>
                        <th>Adm</th>
                        <th>Name</th>
                        <th>Phone No</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Address</th>
                        <th>Guardian's Name</th>
                        <th>Guardian's Phone</th>
                        <th>Guardian's Relationship</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="teachersTableBody">
                </tbody>
            </table>
        </div>


        <!-- Modal -->
        <div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Add Teacher</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="" id="addTeacherForm">
                            <div class="mb-3">
                                <label for="teacherName" class="form-label">Adm no</label>
                                <input type="text" class="form-control" name="admNo" placeholder="Enter Registration No"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="admissionNo" class="form-label">Teacher Name</label>
                                <input type="text" class="form-control" name="name" placeholder="Enter Teacher name"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">Phone no</label>
                                <input type="text" class="form-control" name="phone" placeholder="Enter phone number"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" placeholder="Enter email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="department" class="form-label">National ID</label>
                                <input type="text" class="form-control" name="nationalId" placeholder="Enter national ID"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">Address</label>
                                <input type="text" class="form-control" name="address" placeholder="Enter address"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">Course</label>
                                <input type="text" class="form-control" name="course" placeholder="Enter course"
                                    required>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Save changes</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editTeacherModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Teacher</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="" id="editTeacherForm">
                            <div class="mb-3">
                                <label for="editAdmNo" class="form-label">Adm no</label>
                                <input type="text" class="form-control" id="editAdmNo" name="admNo"
                                    placeholder="Enter Adm no" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="editName" class="form-label">Teacher Name</label>
                                <input type="text" class="form-control" id="editName" name="name"
                                    placeholder="Enter Teacher name" required>
                            </div>
                            <div class="mb-3">
                                <label for="editPhone" class="form-label">Phone no</label>
                                <input type="text" class="form-control" id="editPhone" name="phone"
                                    placeholder="Enter phone number" required>
                            </div>
                            <div class="mb-3">
                                <label for="editAge" class="form-label">Age</label>
                                <input type="text" class="form-control" id="editAge" name="age" placeholder="Enter age"
                                    readonly>
                            </div>
                            <div class="mb-3">
                                <label for="editAddress" class="form-label">Address</label>
                                <input type="text" class="form-control" id="editAddress" name="address"
                                    placeholder="Enter address" required>
                            </div>
                            <div class="mb-3">
                                <label for="editCourse" class="form-label">Course</label>
                                <input type="text" class="form-control" id="editCourse" name="course"
                                    placeholder="Enter course" required>
                            </div>
                            <div class="mb-3">
                                <label for="editGuardianName" class="form-label">Guardian's Name</label>
                                <input type="text" class="form-control" id="editGuardianName" name="guardianName"
                                    placeholder="Enter guardian's name" required>
                            </div>
                            <div class="mb-3">
                                <label for="editGuardianPhone" class="form-label">Guardian's Phone</label>
                                <input type="text" class="form-control" id="editGuardianPhone" name="guardianPhone"
                                    placeholder="Enter guardian's phone number" required>
                            </div>
                            <div class="mb-3">
                                <label for="editGuardianRelationship" class="form-label">Guardian's relationship</label>
                                <input type="text" class="form-control" id="editGuardianRelationship"
                                    name="guardianRelationship" placeholder="Enter guardian's relationship" required>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Save changes</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- <script type="text/javascript" src="addStudents.js"></script> -->
        <!-- <script type="module" src="/src/scripts/showTables.js"></script> -->
        <script src="src/scripts/print.js"></script>


        <script type="module" src="src/scripts/editTeachers.js"></script>
        <script src="src/scripts/addTeachers.js"></script>
        <script src="src/scripts/activePage.js"></script>
        <!-- <script type="module" src="/src/scripts/session.js"></script> -->
        <script>
            // Logout functionality
            document.getElementById('logoutBtn').addEventListener('click', function () {
                // Clear any stored user data (if applicable)
                // localStorage.clear();
                sessionStorage.clear();

                // Redirect to the login page
                window.location.href = 'https://kennah5363.github.io/schoolmanagement/index.html';
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
